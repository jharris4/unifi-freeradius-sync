# Tool configuration only. This project ships as a container image, not a
# distributable package, so there is deliberately no [project] table and no
# build backend -- runtime pins live in requirements.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

# Lint only: `ruff format` is deliberately not used. It collapses the
# expected-output strings in tests/test_authorize_file.py onto single lines,
# and one line per generated line is what makes them readable as the file.
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

