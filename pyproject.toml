# Tool configuration only. This project ships as a container image, not a
# distributable package, so there is deliberately no [project] table and no
# build backend -- runtime pins live in requirements.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

