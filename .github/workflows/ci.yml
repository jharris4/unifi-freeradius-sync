name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # matches the base image in the Dockerfile; aiounifi needs >= 3.13
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: ruff check .

      - run: pytest

  image:
    # the image is only built on a tag, so build it here too -- otherwise a
    # broken Dockerfile is not discovered until release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # loaded into the daemon so the smoke test below can run it, which only
      # works for a single platform -- this is the runner's own architecture
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: unifi-freeradius-sync:ci

      - name: Import the module inside the image
        run: docker run --rm unifi-freeradius-sync:ci python -c "import unifi_freeradius_sync"

      # release.yml publishes linux/arm64 for the Raspberry Pi host, so build
      # it here too. Neither loaded nor pushed: this only has to prove that a
      # multi-architecture build succeeds before a tag depends on it.
      - name: Build every published platform
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: unifi-freeradius-sync:ci-multiarch
